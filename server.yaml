# statusline-server 服务端配置 (server.yaml)
# 默认加载路径优先级:
#   1. 命令行参数 -config <path>
#   2. 环境变量 STATUSLINE_SERVER_CONFIG / STATUSLINE_CONFIG
#   3. 二进制所在目录 server.yaml
#   4. 当前工作目录 ./server.yaml
#   5. 用户全局目录 ~/.config/statusline/server.yaml

# HTTP 监控服务监听与认证
server:
  host: "0.0.0.0"                                  # 监听网卡地址
  port: 8628                                       # 监听端口
  api_key: ""                                      # 可选的服务端接入认证密钥

# 持久化存储引擎 (纯 Go 零 CGO 嵌入式 SQLite3 WAL 模式)
storage:
  db_path: "~/.local/share/statusline/statusline.db" # SQLite 数据库持久化路径
  wal_mode: true                                   # 启用 WAL 高并发写入模式

# 日志设置（服务端默认开启）
# 日志文件固定写入可执行文件所在目录的 statusline-server.log
logging:
  enabled: true                     # 设为 false 关闭日志
  level: "info"                     # debug / info / warn / error
  format: "text"                    # text（人类可读）/ json（结构化）
