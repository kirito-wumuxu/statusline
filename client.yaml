# statusline 客户端配置 (client.yaml)
# 默认加载路径优先级:
#   1. 环境变量 STATUSLINE_CLIENT_CONFIG / STATUSLINE_CONFIG
#   2. 二进制所在目录 client.yaml
#   3. 当前工作目录 ./client.yaml
#   4. 用户全局目录 ~/.config/statusline/client.yaml

# 遥测数据上报
report:
  endpoint: "http://127.0.0.1:8628/api/v1/report" # 设为 "off" 可停用上报，纯本地离线渲染
  timeout_ms: 100                                  # 客户端严格上报超时，绝不阻塞终端
  api_key: ""                                      # 可选的上报认证密钥

# 节点指纹与环境元数据
node:
  id: ""           # 留空则自动提取硬件指纹并 SHA256 脱敏 (如 node_8f9d2a1b4c3e5f6a)
  custom_tags:
    env: "local"

# 终端状态栏渲染设置
display:
  enable_stdout: true
  # 状态栏模块化显示列表：可自由调换顺序，不需要的模块直接注释即可
  # 支持模块：
  #   - dir: 工作区目录，家目录折叠为 [~]
  #   - vcs: Git 分支与修改标记 (main*)
  #   - account: 当前登录账号 <user@email.com>（无账号时自动跳过）
  #   - model: 模型名称与推理深度 [Gemini 3.8 Flash (High)]
  #   - context: 上下文 8 段斜杠进度条与使用百分比 \\\\\\\\ 22% [1M]
  #   - tokens: 会话输入/输出 Token 计数器 ↑1.5k ↓230
  #   - quota: 供应商配额余量与冷却重置倒计时
  segments:
    - dir
    - vcs
    - account
    - model
    - context
    - tokens
    - quota

# 显示别名与窄屏缩写映射（执行 statusline init 可从 statusline-server 自动拉取更新）
aliases:
  # 1. 配额实体映射（剥离 -5h/-weekly 等时间后缀，按前缀最长匹配）
  quotas:
    - key: "gemini"              # 匹配 gemini-5h, gemini-weekly 等
      name: "Gemini"             # 宽屏终端名称
      short_name: "G"            # 空间紧凑缩写标签 (G: 100%)
    - key: "gemini-argon"        # 匹配 gemini-argon-wtu-weekly 特权池
      name: "Argon"              # 宽屏终端名称
      short_name: "Ar"           # 空间紧凑缩写标签 (Ar: 100%)
    - key: "3p"                  # 匹配 3p-5h, 3p-weekly 第三方池
      name: "Claude"
      short_name: "C"

  # 2. 模型实体映射（匹配模型 ID，用于宽屏名称与紧凑模式缩写）
  models:
    - key: "gemini-3.8-flash"
      name: "Gemini 3.8 Flash"
      short_name: "Flash"
    - key: "gemini-3.8-pro"
      name: "Gemini 3.8 Pro"
      short_name: "Pro"
    - key: "claude-3-7-sonnet"
      name: "Claude 3.7 Sonnet"
      short_name: "Sonnet"
    - key: "claude-opus"
      name: "Claude Opus"
      short_name: "Opus"

  # 3. 账号实体映射（匹配登录账号，用于宽屏与窄屏缩写）
  accounts: []

# 日志设置（客户端默认关闭，不影响终端状态栏输出）
# 日志文件固定写入可执行文件所在目录的 statusline.log
logging:
  enabled: false                    # 设为 true 开启调试日志
  level: "info"                     # debug / info / warn / error
  format: "text"                    # text（人类可读）/ json（结构化）
